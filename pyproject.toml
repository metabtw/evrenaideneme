[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "tests"]
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "N"]
ignore = [
    "E501",   # satır uzunluğu ruff format'a bırakıldı
    "N802",   # OpenCV API adlandırması (isOpened, VideoCapture)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N806"]
